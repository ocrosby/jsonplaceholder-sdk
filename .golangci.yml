version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - gocyclo
    - revive
    - unparam
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gocyclo
  settings:
    gocyclo:
      min-complexity: 7
    revive:
      rules:
        - name: exported
formatters:
  enable:
    - gofmt
    - goimports
